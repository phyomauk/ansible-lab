---
# tasks file for lb
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default site config
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy nginx load balancer config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes